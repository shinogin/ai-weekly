name: AI Weekly

on:
  schedule:
    - cron: '0 17 * * 0'   # 毎週月曜 02:00 JST (UTC日曜 17:00)
  workflow_dispatch:

permissions:
  contents: write   # vol.txt をコミットし戻すために必要

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python newsletter.py
        env:
          KIT_API_KEY:        ${{ secrets.KIT_API_KEY }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Persist vol counter
        run: |
          if [[ -n "$(git status --porcelain vol.txt)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add vol.txt
            git commit -m "chore: bump vol counter [skip ci]"
            git push
          else
            echo "vol.txt unchanged; nothing to commit"
          fi
