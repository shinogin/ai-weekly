name: AI Weekly

on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python newsletter.py
        env:
                    KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
