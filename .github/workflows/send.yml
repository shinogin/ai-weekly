name: AI Weekly

on:
  schedule:
    - cron: '0 17 * * 0'   # 毎週月曜 02:00 JST (UTC日曜 17:00)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python newsletter.py
        env:
          KIT_API_KEY:        ${{ secrets.KIT_API_KEY }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
